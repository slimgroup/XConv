[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxconv"
version = "1.0.0"
description = "Low-memory stochastic backpropagation for convolutional layers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mathias Louboutin", email = "mlouboutin3@gatech.edu" },
    { name = "Ali Siahkoohi", email = "alisk@ucf.edu" },
    { name = "Anirudh Thatipelli", email = "anirudh.thatipelli@ucf.edu" },
    { name = "Jeffrey J. Sam", email = "jeffrey.jj.sam@gmail.com" },
]
dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy",
    "matplotlib",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
# Reading device memory through NVML, which the peak-memory measurements report.
memory = ["pynvml"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/slimgroup/XConv"
Paper = "https://openreview.net/forum?id=ajv7wvEvnh"

[tool.setuptools.packages.find]
include = ["pyxconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 90
ignore = "F403,E226,E731,W503,F405,E722,E741,W504,W605"
